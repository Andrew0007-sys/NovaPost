name: NovaPoshta sync

on:
  # 21:00 UTC = 00:00 за Києвом влітку (EEST, UTC+3).
  # Взимку (EET, UTC+2) це буде 23:00 — для нічної збірки довідника неважливо.
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node build-np.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "Без змін" && exit 0
          git commit -m "chore(np): sync $(date -u +%Y-%m-%d)"
          git push
